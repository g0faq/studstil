<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Табло команд</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var q=new URLSearchParams(location.search).get("palette");if(q)localStorage.setItem("bc-palette",q==="orange"?"":q);var p=localStorage.getItem("bc-palette");if(p)document.documentElement.dataset.palette=p}catch(e){}</script>
<style>
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }
  .wrap { height: 100dvh; max-width: none; margin: 0; padding: clamp(20px, 3vh, 46px) clamp(20px, 3vw, 64px); display: flex; flex-direction: column; gap: clamp(16px, 2.5vh, 34px); }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; flex: none; }
  h1 { font-family: Unbounded, sans-serif; font-weight: 800; font-size: clamp(30px, 4.2vw, 68px); line-height: 1; letter-spacing: -0.035em; margin: 0; }
  .timer { font-size: clamp(14px, 1.2vw, 22px); font-weight: 700; color: var(--dim); background: none; border: none; white-space: nowrap; }
  .timer b { color: var(--neon); font-family: Unbounded, sans-serif; font-size: clamp(22px, 2.4vw, 44px); }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(14px, 1.6vw, 28px); }
  @media (max-aspect-ratio: 3/4) { .grid { grid-template-columns: 1fr; grid-auto-rows: 1fr; overflow-y: auto; } }
  .team { --accent: #FF7A1A; position: relative; overflow: hidden; padding: clamp(16px, 1.8vw, 34px); border-radius: clamp(20px, 2vw, 34px);
    display: flex; flex-direction: column; gap: clamp(10px, 1.4vh, 22px); min-height: 0; }
  .team::before { content: ''; position: absolute; top: -12%; right: -8%; width: 40%; aspect-ratio: 1; border-radius: 50%; background: var(--accent); opacity: .26; filter: blur(40px); }
  .team .avatar { width: clamp(46px, 4.2vw, 88px); height: clamp(46px, 4.2vw, 88px); font-size: clamp(18px, 1.7vw, 34px); }
  .team .display { font-size: clamp(18px, 1.8vw, 36px) !important; }
  .team .dim { font-size: clamp(12px, .95vw, 19px); }

  .team-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 52%) 1fr; align-items: center; gap: clamp(10px, 1.2vw, 24px); }
  .vessel { height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; color: var(--accent); }
  .flacon { width: 100%; height: 100%; }
  .team-right { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(2px, .4vh, 8px); }
  .score { display: flex; align-items: baseline; gap: 6px; line-height: .82; }
  .big { font-family: Unbounded, sans-serif; font-weight: 800; font-size: clamp(48px, 7vw, 132px); line-height: .82; letter-spacing: -0.05em; color: var(--accent); }
  .score-note { font-family: Unbounded, sans-serif; font-size: clamp(18px, 1.8vw, 36px); font-weight: 600; color: var(--dim); }
  .score-cap { font-size: clamp(10px, .8vw, 15px); line-height: 1.3; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--dim); }
  .tags { flex: none; display: flex; gap: clamp(5px, .5vw, 10px); flex-wrap: wrap; }
  .tag { padding: clamp(5px, .7vh, 11px) clamp(9px, .9vw, 16px); border-radius: 999px; font-size: clamp(11px, .95vw, 19px); font-weight: 700; background: var(--chip); color: var(--dim); border: 1px solid var(--stroke); }
  .tag.on { background: var(--accent); color: #140A02; border-color: transparent; }
  .status { font-size: clamp(12px, 1vw, 20px); font-weight: 600; color: var(--dim); }

  /* Жидкость во флаконе */
  .liquid { transform: translateY(var(--y, 188px)); transition: transform 1.1s cubic-bezier(.34,1.2,.64,1); }
  .wave { animation: waveMove 5s linear infinite; }
  .w2 { animation-duration: 7.5s; animation-direction: reverse; }
  @keyframes waveMove { from { transform: translateX(0); } to { transform: translateX(-120px); } }
  .bub { animation: bubUp 4.5s ease-in infinite; }
  .b1 { animation-duration: 6s; animation-delay: -2s; } .b2 { animation-duration: 5.2s; animation-delay: -3.4s; }
  @keyframes bubUp { 0% { transform: translateY(150px); opacity: 0; } 15% { opacity: .5; } 85% { opacity: .35; } 100% { transform: translateY(14px); opacity: 0; } }
  .flacon.full { filter: drop-shadow(0 0 22px color-mix(in srgb, var(--accent) 60%, transparent)); }

  .ic { width: 1.15em; height: 1.15em; vertical-align: -.2em; margin-right: .35em; }
  .status.ok { color: var(--accent); display: inline-flex; align-items: center; gap: .4em; }
  .tools { flex: none; display: flex; gap: 10px; align-items: center; font-size: clamp(11px, .9vw, 16px); }
  .pill.danger { border-color: color-mix(in srgb, var(--err) 55%, transparent); color: var(--err); }
  .pill.danger:hover { background: color-mix(in srgb, var(--err) 14%, transparent); }
  .team.enter { animation: riseIn .6s var(--ease-out) both; animation-delay: calc(var(--i) * 90ms); }
  .team.bump { animation: bump .9s var(--ease-out); }
  @keyframes bump { 0% { box-shadow: 0 0 0 0 var(--accent); } 30% { box-shadow: 0 0 0 4px var(--accent), 0 0 60px color-mix(in srgb, var(--accent) 60%, transparent); transform: translateY(-6px); } 100% { box-shadow: 0 0 0 0 transparent; transform: none; } }
  .team.win { box-shadow: 0 0 0 2px var(--accent), 0 20px 60px color-mix(in srgb, var(--accent) 35%, transparent); }
  .tag.pop { animation: stampIn .55s var(--ease-spring) both; }
  @media (prefers-reduced-motion: reduce) { .wave, .bub { animation: none !important; } .liquid { transition: none; } }
  .login { max-width: 420px; margin: 12vh auto; display: flex; flex-direction: column; gap: 12px; }
  .login input { padding: 16px 18px; border-radius: 18px; color: var(--ink); font-size: 16px; font-family: inherit; }
</style>
</head>
<body>
<div class="login hidden" id="login">
  <h1 style="font-size:28px">Табло команд</h1>
  <input id="key" class="glass" type="password" placeholder="Ключ преподавателя" autocomplete="current-password">
  <button class="btn-main btn-grad" id="login-btn" type="button">Открыть</button>
  <div class="err" id="login-err"></div>
</div>
<div class="blobs" aria-hidden="true" style="position:fixed"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true" style="position:fixed"></div>
<div class="wrap hidden" id="board" style="position:relative">
  <div class="head">
    <h1>Кто раскроет клиента первым</h1>
    <button class="timer" id="timer" type="button" title="Клик — старт/пауза, двойной клик — сброс">Осталось <b id="time">10:00</b></button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="tools">
    <span class="dim" id="updated"></span>
    <span style="flex:1"></span>
    <button class="pill" id="reset-btn" type="button">Сбросить прогресс</button>
    <button class="pill danger" id="end-btn" type="button">Завершить игру</button>
  </div>
</div>
<script src="config.js"></script>
<script src="board.js"></script>
</body>
</html>
