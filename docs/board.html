<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Табло команд</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var q=new URLSearchParams(location.search).get("palette");if(q)localStorage.setItem("bc-palette",q==="orange"?"":q);var p=localStorage.getItem("bc-palette");if(p)document.documentElement.dataset.palette=p}catch(e){}</script>
<style>
  body { padding: 28px 20px 60px; }
  .wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  h1 { font-family: Unbounded, sans-serif; font-weight: 800; font-size: clamp(28px, 4vw, 48px); line-height: 1; letter-spacing: -0.035em; margin: 0; }
  .timer { font-size: 18px; font-weight: 700; color: var(--dim); background: none; border: none; }
  .timer b { color: var(--neon); font-family: Unbounded, sans-serif; font-size: 26px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .team { --accent: #FF7A1A; position: relative; overflow: hidden; padding: 28px; border-radius: 28px; display: flex; flex-direction: column; gap: 18px; }
  .team::before { content: ''; position: absolute; top: -60px; right: -40px; width: 170px; height: 170px; border-radius: 50%; background: var(--accent); opacity: .28; filter: blur(30px); }
  .team.win { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .big { font-family: Unbounded, sans-serif; font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -0.04em; color: var(--accent); }
  .tag { padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; background: var(--chip); color: var(--dim); border: 1px solid var(--stroke); }
  .tag.on { background: var(--accent); color: #1a1024; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .team.enter { animation: riseIn .6s var(--ease-out) both; animation-delay: calc(var(--i) * 90ms); }
  .team.bump { animation: bump .9s var(--ease-out); }
  @keyframes bump { 0% { box-shadow: 0 0 0 0 var(--accent); } 30% { box-shadow: 0 0 0 4px var(--accent), 0 0 60px color-mix(in srgb, var(--accent) 60%, transparent); transform: translateY(-4px); } 100% { box-shadow: 0 0 0 0 transparent; transform: none; } }
  .team.win { box-shadow: 0 0 0 2px var(--accent), 0 20px 60px color-mix(in srgb, var(--accent) 35%, transparent); }
  .tag.pop { animation: stampIn .55s var(--ease-spring) both; }
  .fill { transition: transform .9s var(--ease-out) !important; }
  h1 .ch { display: inline-block; }
  .login { max-width: 420px; margin: 12vh auto; display: flex; flex-direction: column; gap: 12px; }
  .login input { padding: 16px 18px; border-radius: 18px; color: var(--ink); font-size: 16px; font-family: inherit; }
</style>
</head>
<body>
<div class="login hidden" id="login">
  <h1 style="font-size:28px">Табло команд</h1>
  <input id="key" class="glass" type="password" placeholder="Ключ преподавателя" autocomplete="current-password">
  <button class="btn-main btn-grad" id="login-btn" type="button">Открыть</button>
  <div class="err" id="login-err"></div>
</div>
<div class="blobs" aria-hidden="true" style="position:fixed"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true" style="position:fixed"></div>
<div class="wrap hidden" id="board" style="position:relative">
  <div class="head">
    <h1>Кто раскроет клиента первым</h1>
    <button class="timer" id="timer" type="button" title="Клик — старт/пауза, двойной клик — сброс">Осталось <b id="time">10:00</b></button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="tools">
    <span class="dim" style="font-size:13px" id="updated"></span>
    <span style="flex:1"></span>
    <button class="pill" id="reset-btn" type="button">Сбросить все сессии</button>
  </div>
</div>
<script src="config.js"></script>
<script src="board.js"></script>
</body>
</html>
