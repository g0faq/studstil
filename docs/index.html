<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beauty Case</title>
<meta name="description" content="Разгадай клиента: задавай вопросы, собирай факты, найди настоящий запрос.">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF7A1A'/%3E%3Cstop offset='.55' stop-color='%23FFB547'/%3E%3Cstop offset='1' stop-color='%23FF5A36'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='20' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='900' font-size='34' fill='%23fff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var q=new URLSearchParams(location.search).get('palette');if(q)localStorage.setItem('bc-palette',q==='orange'?'':q);var p=localStorage.getItem('bc-palette');if(p)document.documentElement.dataset.palette=p;var t=localStorage.getItem('bc-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app" id="app">
  <div class="glow"></div>

  <!-- Старт -->
  <section class="screen" id="start">
    <div class="start-top"><button class="pill" id="theme-btn" type="button">Светлая тема</button></div>
    <div class="start-body">
      <div class="logo">B</div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <h1 class="title">Beauty<br>Case</h1>
        <p class="lead">Разгадай клиента. Задавай вопросы, собирай факты, найди настоящий запрос.</p>
      </div>
      <form id="code-form" style="display:flex;flex-direction:column;gap:10px;padding-top:6px">
        <label for="code" class="caps dim" style="font-size:12px;letter-spacing:.16em">Код команды</label>
        <input id="code" class="code-input glass" inputmode="numeric" autocomplete="off" placeholder="например, 101" maxlength="20">
        <div class="err" id="code-err" role="alert"></div>
      </form>
    </div>
    <button class="btn-main btn-grad" id="enter-btn" type="submit" form="code-form">Войти</button>
    <div class="foot">Один QR-код на всех · три команды</div>
  </section>

  <!-- Карточка клиента -->
  <section class="screen hidden" id="card">
    <div class="bar">
      <button class="icon-btn" data-go="start" type="button" aria-label="Назад">←</button>
      <div class="caps dim" style="font-size:12px;letter-spacing:.16em">Карточка клиента</div>
      <div style="width:40px"></div>
    </div>
    <div class="card-body">
      <div class="ring-wrap"><div class="ring"></div><div class="avatar" data-f="letter" style="width:168px;height:168px;font-size:64px;animation:bcFloat 6s ease-in-out infinite;box-shadow:0 24px 60px rgba(0,0,0,.3)"></div></div>
      <div style="display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center">
        <div class="display" style="font-weight:800;font-size:38px" data-f="name"></div>
        <div class="dim" style="font-size:15px;font-weight:600" data-f="meta"></div>
      </div>
      <div class="quote glass">
        <div class="caps" style="color:var(--accent)">Она сказала только это</div>
        <div class="quote-text">«<span data-f="card_hint"></span>»</div>
      </div>
    </div>
    <button class="btn-main btn-accent" data-go="chat" type="button">Начать консультацию</button>
  </section>

  <!-- Чат -->
  <section class="screen hidden" id="chat">
    <div class="chat-head">
      <button class="icon-btn" data-go="card" type="button" aria-label="К карточке" style="width:38px;height:38px;border-radius:13px;font-size:16px">←</button>
      <div class="avatar" data-f="letter" style="width:42px;height:42px;font-size:17px"></div>
      <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
        <div class="display" style="font-weight:600;font-size:17px" data-f="name"></div>
        <div style="font-size:12px;color:var(--accent);font-weight:600" id="status">в сети</div>
      </div>
      <button class="pill" id="dossier-btn" type="button" aria-expanded="false">Досье</button>
    </div>
    <div class="progress glass">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <span style="font-size:13px;font-weight:700" id="prog-text">Раскрыто 0 из 4 фактов</span>
        <span class="dim" style="font-size:12px;font-weight:600" id="prog-label">продолжайте</span>
      </div>
      <div class="track"><div class="fill" id="prog-fill" style="width:0%"></div></div>
      <div id="dossier" class="hidden" style="display:flex;flex-direction:column;gap:8px;padding-top:4px"></div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="finish-wrap hidden" id="finish-wrap"><button class="btn-main btn-grad" data-go="done" type="button" style="font-size:16px;padding:18px;border-radius:22px">Сформулировать проблему</button></div>
    <div class="chips" id="chips"></div>
    <form class="composer" id="composer">
      <input id="q" class="glass" placeholder="Задайте вопрос клиентке…" autocomplete="off" maxlength="500" aria-label="Вопрос клиентке">
      <button class="send" type="submit" aria-label="Отправить">↑</button>
    </form>
  </section>

  <!-- Итог -->
  <section class="screen hidden" id="done">
    <div class="done-head">
      <div class="check"><span>✓</span></div>
      <div class="display" style="font-weight:800;font-size:30px">Проблема найдена</div>
      <div class="dim" style="font-size:15px;line-height:1.45;text-wrap:pretty" id="problem"></div>
    </div>
    <div class="done-body">
      <div class="panel glass">
        <div class="caps" style="color:var(--accent)">Досье · <span data-f="name"></span></div>
        <div id="done-facts" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>
      <div class="task">
        <div class="caps" style="opacity:.85">Задание команде · офлайн</div>
        <div id="tasks" style="display:flex;flex-direction:column;gap:10px"></div>
        <div style="font-size:13px;opacity:.85;padding-top:4px" id="task-time"></div>
      </div>
      <button class="ghost" id="restart-btn" type="button">Вернуться к началу</button>
    </div>
  </section>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
