# Развёртывание на Amvera. Один процесс отдаёт и сайт, и API — всё с одного домена.
meta:
  environment: nodejs
  toolchain:
    name: npm
    version: 20
build:
  skip: false
run:
  # База и картинки лежат на постоянном диске, иначе прогресс пропадёт при перезапуске
  persistenceMount: /data
  containerPort: 8080
  # Amvera запускает файл через node, а не команду npm
  scriptName: src/index.js
